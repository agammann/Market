name: Verify and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: Prepare the tag only, or publish its verified source assets
        required: true
        type: choice
        default: prepare-tag
        options: [prepare-tag, publish]
      expected_sha:
        description: Full reviewed main commit SHA (40 lowercase hex characters)
        required: true
        type: string
      expected_version:
        description: Exact package.json version at that commit (for example 1.0.3)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: market-v1-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
      - run: npm install --global pnpm@11.25.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --audit-level high
      - run: python scripts/build-release.py
      - run: python scripts/check-release.py dist-release --source .
      - run: python scripts/verify-source-consumer.py dist-release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.os == 'ubuntu-24.04'
        with:
          name: market-v1-source
          path: dist-release/*
          if-no-files-found: error
          retention-days: 14
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker compose config --quiet
      - run: docker compose build
  browser-routes:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/market-browser-tools" --no-save --no-package-lock --ignore-scripts playwright@1.63.0
          "$RUNNER_TEMP/market-browser-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Exercise marketplace routes in Chromium
        run: node scripts/check-browser-routes.mjs
        env:
          MARKET_PLAYWRIGHT_DIR: ${{ runner.temp }}/market-browser-tools
  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: [source, docker, browser-routes]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      MARKET_RELEASE_MODE: ${{ inputs.mode }}
      MARKET_RELEASE_SHA: ${{ inputs.expected_sha }}
      MARKET_RELEASE_VERSION: ${{ inputs.expected_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
      - name: Validate the reviewed release commit and version
        run: node scripts/prepare-release-tag.mjs --validate
      - name: Prepare the current version tag without publishing
        if: inputs.mode == 'prepare-tag'
        run: node scripts/prepare-release-tag.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.mode == 'publish'
        with:
          name: market-v1-source
          path: dist-release
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: inputs.mode == 'publish'
        with:
          python-version: '3.12'
      - run: node scripts/publish-release.mjs dist-release
        if: inputs.mode == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
